name: run-monitor

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 09:15 (UTC 01:15) 盤中主波段發動前掃描
    - cron: '15 1 * * 1-5'
    # 台灣時間 13:35 (UTC 05:35) 盤後自動復盤
    - cron: '35 5 * * 1-5'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Run Stock Breakout Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_records.db || true
          git commit -m "Auto update trading records database [skip ci]" || true
          git push || true
