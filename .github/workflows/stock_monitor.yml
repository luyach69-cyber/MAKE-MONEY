name: run-monitor

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: '執行模式選擇'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - night
          - intraday
  schedule:
    # 盤中監控：台灣時間 09:05 ~ 10:25 每 10 分鐘 (UTC 01:05 ~ 02:25)
    - cron: '5,15,25,35,45,55 1 * * 1-5'
    - cron: '5,15,25 2 * * 1-5'
    # 盤後復盤：台灣時間 13:35 (UTC 05:35)
    - cron: '35 5 * * 1-5'
    # 夜間預選名單：台灣時間週日至週四 20:00 (UTC 12:00)
    - cron: '0 12 * * 0-4'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Run Stock Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_MODE: ${{ inputs.run_mode }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          echo "當前 UTC 小時: $CURRENT_HOUR, 選擇模式: $INPUT_MODE"
          
          if [ "$INPUT_MODE" = "night" ] || [ "$CURRENT_HOUR" -eq 12 ]; then
            echo ">>> 啟動夜間預選名單推播模式 (--night)"
            python main.py --night
          else
            echo ">>> 啟動常規盤中策略掃描模式"
            python main.py
          fi

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_records.db || true
          git commit -m "Auto update trading records database [skip ci]" || true
          git push || true
