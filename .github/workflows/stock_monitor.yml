name: Manual Trading Signal Monitor

on:
  schedule:
    # 台灣時區 (UTC+8) 週一至週五：
    # 早盤 09:20, 09:40, 10:00, 10:20 (UTC 01:20, 01:40, 02:00, 02:20)
    - cron: '20,40 1 * * 1-5'
    - cron: '0,20 2 * * 1-5'
    # 午盤突破 11:20, 11:50, 12:20 (UTC 03:20, 03:50, 04:20)
    - cron: '20,50 3 * * 1-5'
    - cron: '20 4 * * 1-5'
    # 收盤歸檔與月底結算 13:40 (UTC 05:40)
    - cron: '40 5 * * 1-5'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas python-dateutil pytz

      - name: Run Scan & Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit Historical Records
        run: |
          git config --local user.email "bot@action.com"
          git config --local user.name "SignalBot"
          git add data/history/*.csv || true
          if git diff --staged --quiet; then
            echo "No new signals."
          else
            git commit -m "Add manual trading signal log [skip ci]"
            git push
          fi
