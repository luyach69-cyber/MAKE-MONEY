name: Intraday Stock Scanner & Post Review

on:
  # 支援手動立即測試執行
  workflow_dispatch:
  # 定時排程 (UTC 時間，台灣時間需 -8 小時)
  schedule:
    # 台灣時間 09:05 (UTC 01:05) 執行開盤至盤中主波段掃描
    - cron: '5 1 * * 1-5'
    # 台灣時間 13:35 (UTC 05:35) 執行盤後自動復盤與戰報推播
    - cron: '35 5 * * 1-5'

jobs:
  run-trading-system:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install pandas numpy requests

      - name: 執行當沖系統
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: 保存 SQLite 復盤資料庫記錄
        uses: actions/upload-artifact@v4
        with:
          name: trading-database
          path: trading_records.db
          retention-days: 30
