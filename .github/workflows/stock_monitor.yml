name: Manual Trading Signal Monitor

on:
  schedule:
    # 台灣時區 (UTC+8) 週一至週五：
    # 09:15 ~ 10:30 每 15 分鐘一次 (UTC 01:15 ~ 02:30)
    - cron: '15,30,45 1 * * 1-5'
    - cron: '0,15,30 2 * * 1-5'
    # 11:30 ~ 12:30 突破區間 (UTC 03:30 ~ 04:30)
    - cron: '30,45 3 * * 1-5'
    - cron: '0,15,30 4 * * 1-5'
    # 13:30 收盤結算與月底檢查 (UTC 05:30)
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas python-dateutil pytz

      - name: Run Scan & Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit Historical Records
        run: |
          git config --local user.email "bot@action.com"
          git config --local user.name "SignalBot"
          git add data/history/*.csv || true
          if git diff --staged --quiet; then
            echo "No new signals."
          else
            git commit -m "Add manual trading signal log [skip ci]"
            git push
          fi
